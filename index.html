<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pik</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/splash.css">
<link rel="stylesheet" href="css/vista.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/wall.css">
<link rel="stylesheet" href="css/aero-alert.css">
<link rel="icon" href="icons/vista.start.webp">
</head>
<body>

<div id="splash">
  <div class="chick"></div>
  <div class="splash-title">Выполняется вход…</div>
  <div id="splashMsg">Подключаюсь к Firebase</div>
</div>
<noscript><p style="position:fixed;inset:0;z-index:200;background:#fff;padding:30px;font:16px sans-serif">Для Pik нужен включённый JavaScript.</p></noscript>
<script src="js/boot-check.js"></script>

<section id="auth" class="hidden">
  <div class="auth-top"><span class="logo">Pik</span></div>
  <div class="auth-wrap">
    <div class="auth-hero">
      <div class="chick"></div>
      <p class="bubble">Добро пожаловать в <b>Pik</b>! Войдите или зарегистрируйтесь, чтобы начать общение.</p>
    </div>
    <div class="auth-box">
      <div class="auth-tabs">
        <button id="tabLogin" class="on" type="button">Вход</button>
        <button id="tabReg" type="button">Регистрация</button>
      </div>
      <label class="row"><span>Юзернейм</span>
        <div class="at-wrap"><b>@</b><input id="aUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32"></div>
      </label>
      <label class="row regOnly hidden"><span>Имя</span><input id="aName" autocomplete="name" maxlength="40"></label>
      <label class="row"><span>Пароль</span><input id="aPass" type="password" autocomplete="current-password"></label>
      <div class="err" id="aErr"></div>
      <button class="btn" id="aGo" type="button">Войти</button>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <span class="logo">Pik</span>
      <input id="search" class="top-search" placeholder="Найти по @юзернейму…" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button id="meBtn" class="top-me" type="button" aria-label="Профиль"></button>
    </div>
  </header>

  <div class="page">
    <nav class="nav">
      <button id="navMessages" class="on" type="button">Сообщения</button>
      <button id="navRecs" type="button">Рекомендации</button>
      <button id="navProfile" type="button">Мой профиль</button>
      <button id="navWall" type="button">Моя стена</button>
      <button id="navChannel" type="button">Новый канал</button>
      <button id="navGroup" type="button">Новая группа</button>
      <button id="navLogout" type="button">Выйти</button>
    </nav>

    <section class="box dialogs">
      <div class="box-head">Контакты</div>
      <div id="dialogs" class="dialogs-list"></div>
    </section>

    <section class="box chat" id="chat"></section>
  </div>
</div>

<div id="profileModal" class="modal hidden">
  <div class="pop">
    <div class="pop-head">Мой профиль</div>
    <div class="pop-body">
      <div class="ava-pick">
        <span id="pAvatar"></span>
        <button class="link" id="pPick" type="button">Выбрать фото из памяти устройства</button>
      </div>
      <label class="row"><span>Имя</span><input id="pName" maxlength="40"></label>
      <label class="row"><span>Юзернейм</span><input id="pUser" autocapitalize="none" spellcheck="false" maxlength="33"></label>
      <div class="err" id="pErr"></div>
    </div>
    <div class="pop-foot">
      <button class="btn light" id="pClose" type="button">Закрыть</button>
      <button class="btn" id="pSave" type="button">Сохранить</button>
    </div>
  </div>
</div>

<div id="channelModal" class="modal hidden">
  <div class="pop">
    <div class="pop-head">Новый канал</div>
    <div class="pop-body">
      <div class="ava-pick">
        <span id="cAvatar"></span>
        <button class="link" id="cPick" type="button">Выбрать фото канала</button>
      </div>
      <label class="row"><span>Название</span><input id="cName" maxlength="50"></label>
      <label class="row"><span>Юзернейм канала</span>
        <div class="at-wrap"><b>@</b><input id="cHandle" autocapitalize="none" spellcheck="false" maxlength="32"></div>
      </label>
      <label class="row"><span>Описание</span><textarea id="cAbout" rows="2" maxlength="200"></textarea></label>
      <div class="err" id="cErr"></div>
    </div>
    <div class="pop-foot">
      <button class="btn light" id="cClose" type="button">Отмена</button>
      <button class="btn" id="cCreate" type="button">Новый канал</button>
    </div>
  </div>
</div>

<div id="groupModal" class="modal hidden">
  <div class="pop">
    <div class="pop-head">Новая группа</div>
    <div class="pop-body">
      <div class="ava-pick">
        <span id="gAvatar"></span>
        <button class="link" id="gPick" type="button">Выбрать фото группы</button>
      </div>
      <label class="row"><span>Название</span><input id="gName" maxlength="50"></label>
      <div class="row"><span>Участники</span>
        <div class="add-row">
          <div class="at-wrap" style="flex:1"><b>@</b><input id="gMember" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="юзернейм"></div>
          <button class="btn light" id="gAdd" type="button">Добавить</button>
        </div>
      </div>
      <div class="chips" id="gChips"></div>
      <div class="err" id="gErr"></div>
    </div>
    <div class="pop-foot">
      <button class="btn light" id="gClose" type="button">Отмена</button>
      <button class="btn" id="gCreate" type="button">Новая группа</button>
    </div>
  </div>
</div>

<div id="membersModal" class="modal hidden">
  <div class="pop">
    <div class="pop-head" id="mTitle">Участники</div>
    <div class="pop-body" id="mBody"></div>
    <div class="pop-foot">
      <button class="btn danger-soft hidden" id="mLeave" type="button">Покинуть группу</button>
      <button class="btn light" id="mClose" type="button">Закрыть</button>
    </div>
  </div>
</div>

<input type="file" id="fileAvatar" accept="image/*" hidden>
<input type="file" id="fileChannel" accept="image/*" hidden>
<input type="file" id="fileGroup" accept="image/*" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
